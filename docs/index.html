<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="三个可操作的原创交互样品：原文检索、双表核对与产品展示。">
  <title>交互样品</title>
  <style>
    :root{--paper:#fff;--ink:#17271e;--muted:#526258;--line:#718176;--action:#174c37;--text:1rem;--small:.875rem;--heading:2rem;--space:1.5rem}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:var(--text)/1.7 system-ui,sans-serif}main{max-width:49rem;margin:auto;padding:3rem var(--space)}h1{font-size:var(--heading);line-height:1.3;margin:0 0 var(--space)}h2{font-size:1.25rem;margin:0}p{margin:.5rem 0;color:var(--muted)}.intro{max-width:36rem;margin-bottom:2rem}article{display:grid;grid-template-columns:1fr auto;gap:var(--space);align-items:center;padding:var(--space) 0;border-top:1px solid var(--line)}a{display:inline-flex;min-height:3rem;align-items:center;justify-content:center;border:1px solid var(--action);padding:.5rem .9rem;color:var(--action);text-decoration:none;touch-action:manipulation}a:focus-visible{outline:3px solid var(--ink);outline-offset:4px}a:active{background:var(--action);color:var(--paper)}footer{border-top:1px solid var(--line);padding-top:var(--space);font-size:var(--small)}@media(hover:hover){a:hover{background:var(--action);color:var(--paper)}}@media(max-width:35rem){main{padding:2rem var(--space)}article{grid-template-columns:1fr;gap:.5rem}a{justify-self:start;min-width:9rem}}
  </style>
</head>
<body>
  <main>
    <h1>交互样品</h1>
    <p class="intro">三个可以直接操作的个人演示，均为 AI 辅助制作。资料和产品为虚构示例。</p>
    <article>
      <div><h2>资料检索</h2><p>搜索交付日期，查看来源片段、历史记录和原文。</p></div>
      <a href="knowledge/">打开资料检索</a>
    </article>
    <article>
      <div><h2>双表核对</h2><p>加载演示数据，查看缺失、重复和数值差异，再导出结果。</p></div>
      <a href="compare/">打开双表核对</a>
    </article>
    <article>
      <div><h2>产品展示页</h2><p>切换图片、查看大图、调整配色，整理并下载需求单。</p></div>
      <a href="website/">打开产品展示</a>
    </article>
    <footer><p>本页不收集表单或上传文件。双表核对在当前浏览器内运行。</p></footer>
  </main>
</body>
</html>
